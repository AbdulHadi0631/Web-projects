<html>
<head>
    <title> Product Card Layout</title>
<style>
    body{
    .Product-card
     {
        background-color: white;
        font-family: Times New Roman;
        font-size: 20px;
        padding: 15px;
        margin: 10px;
        text-align: center;
    }
    .Product-card img
    {
        width: 200px;
        height: 200px;
    }
    .Product-card :hover
    {
        box-shadow: 8px;    
    }
    .Product-card
    {
    button
    {
        background-color: blue;
        color: white;
        padding: 10px ;
        border: 10px;
        cursor: pointer;

    }
    .Product-card button:hover
    {
        background-color: darkblue;

    }
</style>
</head>
<body>
    <div class="Product-card">
        <img src="https://cdn3.evostore.io/productimages/sigel/l/co827_spiralblock_conceptum_a5_3a69b999.jpg" alt="Notepad">
        <h3>Notepad</h3>
        <p>This is an 200 pages premimum notepad High Quality</p>
        <h4>$15.00</h4>
        <br>
        <button>Buy Now</button>
    </div>
    </body>
</html>
